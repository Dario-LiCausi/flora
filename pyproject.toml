[project]
name = "flora-local"
version = "0.2.0"
description = "A small, controlled local LLM helper: explicit memory, human approval, checked outputs."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []

[project.scripts]
flora = "flora.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["flora"]
